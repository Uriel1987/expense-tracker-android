    --font-display: "Frank Ruhl Libre", Georgia, serif;
    --font-body: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181B; --card-bg: #1E2027; --text: #F3EFE4; --text-muted: #A79E8C;
      --border: #33353B; --accent: #D9A857; --accent-dark: #C08A2E; --accent-text: #1E2430;
      --danger: #E2695A; --success: #4E9C82;
      --shadow: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.35);
      --shadow-lg: 0 10px 24px -4px rgba(0,0,0,.5), 0 4px 10px 0 rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181B; --card-bg: #1E2027; --text: #F3EFE4; --text-muted: #A79E8C;
    --border: #33353B; --accent: #D9A857; --accent-dark: #C08A2E; --accent-text: #1E2430;
    --danger: #E2695A; --success: #4E9C82;
    --shadow: 0 1px 2px 0 rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.35);
    --shadow-lg: 0 10px 24px -4px rgba(0,0,0,.5), 0 4px 10px 0 rgba(0,0,0,.3);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-text-size-adjust: 100%;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 20px 16px 100px; min-height: 100vh; }
  h1, h2, h3 { margin: 0; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; }
  .top-bar h1 { font-family: var(--font-display); font-size: 21px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .top-bar h1 .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--text); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .top-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 50%; width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: none;
    transition: background .15s ease;
  }
  .icon-btn:active { background: var(--border); }
  .icon-btn svg { width: 16px; height: 16px; }

  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px;
    box-shadow: var(--shadow); margin-bottom: 14px;
  }
  .month-nav button {
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 700; padding: 6px 12px; cursor: pointer; border-radius: 8px; font-family: var(--font-body);
  }
  .month-nav button:active { background: var(--border); }
  .month-nav .label { font-weight: 700; font-size: 16px; text-align: center; flex: 1; font-family: var(--font-display); }

  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .summary-row { display: flex; gap: 10px; }
  .summary-box { flex: 1; text-align: center; }
  .summary-box .val { font-family: var(--font-display); font-size: 21px; font-weight: 700; }
  .summary-box .lbl { font-size: 12px; color: var(--text-muted); margin-top: 3px; }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
  .section-title h2 { font-size: 13px; color: var(--text-muted); font-weight: 700; letter-spacing: .01em; }
  .section-title a { font-size: 13px; color: var(--accent); cursor: pointer; font-weight: 600; }

  .bar-row { margin-bottom: 10px; }
  .bar-row .bar-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-row .bar-top .cat { font-weight: 600; }
  .bar-row .bar-top .amt { color: var(--text-muted); }
  .bar-track { background: var(--border); border-radius: 6px; height: 8px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; border-radius: 6px; }

  .empty-note { color: var(--text-muted); font-size: 14px; text-align: center; padding: 18px 0; }

  .expense-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .expense-item:last-child { border-bottom: none; }
  .expense-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); flex-shrink: 0; opacity: .88; }
  .expense-info { flex: 1; min-width: 0; }
  .expense-desc { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .expense-meta { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .expense-amt { font-family: var(--font-display); font-weight: 700; font-size: 14.5px; white-space: nowrap; }
  .recur-badge { font-size: 10px; background: var(--border); color: var(--text-muted); padding: 1px 6px; border-radius: 6px; margin-inline-start: 6px; vertical-align: middle; }

  .fab {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-320px);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent); color: var(--accent-text); border: none;
    font-size: 26px; font-weight: 300; box-shadow: var(--shadow-lg); cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 50;
    transition: transform .1s ease;
  }
  @media (max-width: 640px) { .fab { left: auto; right: 24px; transform: none; } }
  .fab:active { transform: scale(0.94); background: var(--accent-dark); }
  @media (max-width: 640px) { .fab:active { transform: scale(0.94); } }

  .tabs { display: flex; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; margin-bottom: 14px; }
  .tab-btn { flex: 1; background: none; border: none; padding: 11px 8px; font-size: 13px; font-family: var(--font-body); font-weight: 500; color: var(--text-muted); border-radius: 11px; cursor: pointer; }
  .tab-btn.active { background: var(--bg); color: var(--text); font-weight: 700; box-shadow: 0 1px 3px rgba(30,36,48,.14); }

  .pie-wrap { position: relative; width: 170px; height: 170px; margin: 4px auto 6px; }
  .pie-wrap svg { display: block; }
  .pie-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .pie-total { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
  .pie-total-lbl { font-size: 11px; color: var(--text-muted); }
  .legend-list { margin-top: 10px; }
  .legend-item { padding: 7px 0; border-bottom: 1px solid var(--border); }
  .legend-item:last-child { border-bottom: none; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-pct { color: var(--text-muted); font-size: 12px; min-width: 32px; text-align: center; }
  .legend-amt { font-weight: 700; min-width: 78px; text-align: left; }
  .budget-bar { background: var(--border); height: 5px; border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .budget-bar-fill { height: 100%; background: var(--success); border-radius: 3px; }
  .budget-bar-fill.over { background: var(--danger); }
  .budget-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .budget-label.over { color: var(--danger); font-weight: 600; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .filter-row input[type=text] { flex: 2; margin: 0; }
  .filter-row select { flex: 1; margin: 0; }
  .filter-result-note { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }

  .compare-cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .compare-cat-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .compare-cat-row select { margin: 0; flex: 1; }

  .change-up { color: var(--danger); font-weight: 700; font-size: 12px; }
  .change-down { color: var(--success); font-weight: 700; font-size: 12px; }
  .change-flat { color: var(--text-muted); font-size: 12px; }
  .month-row { cursor: pointer; }

  .sheet-overlay { position: fixed; inset: 0; background: rgba(30,36,48,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
  .sheet { background: var(--card-bg); width: 100%; max-width: 640px; border-radius: 20px 20px 0 0; padding: 22px 18px calc(20px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto; }
  .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .sheet-header h3 { font-family: var(--font-display); font-size: 17px; }
  .sheet-header .close { color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 4px 8px; }

  label { display: block; font-size: 12.5px; color: var(--text-muted); margin: 12px 0 6px; font-weight: 600; }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%; padding: 11px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 15px; font-family: var(--font-body);
  }
  input[type=number], input[type=date] { direction: ltr; text-align: right; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 16px 0 0; }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .checkbox-row label { margin: 0; font-size: 14px; color: var(--text); }

  .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-family: var(--font-body); font-weight: 700; letter-spacing: .01em; cursor: pointer; margin-top: 14px; }
  .btn-primary { background: var(--accent); color: var(--accent-text); box-shadow: var(--shadow); }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-danger { background: transparent; color: var(--danger); font-weight: 600; margin-top: 8px; }
  .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn:active { opacity: 0.85; }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .divider-text { text-align: center; color: var(--text-muted); font-size: 12px; margin: 16px 0 4px; position: relative; }

  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 20px; font-size: 13px; }
  .chip .x { color: var(--danger); cursor: pointer; font-weight: 700; }

  .cat-list { margin-top: 4px; }
  .cat-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row-name { flex: 2; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-row-name-input { flex: 2 !important; margin: 0 !important; padding: 8px !important; font-size: 13px !important; font-weight: 500 !important; }
  .cat-row-budget { flex: 1; margin: 0 !important; padding: 8px !important; font-size: 13px !important; direction: ltr; text-align: center; }
  .cat-row .x { color: var(--danger); cursor: pointer; font-weight: 700; font-size: 15px; flex-shrink: 0; }

  .recur-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .recur-item:last-child { border-bottom: none; }
  .recur-info .name { font-weight: 600; font-size: 14px; }
  .recur-info .meta { font-size: 12px; color: var(--text-muted); }
  .recur-actions { display: flex; gap: 10px; }
  .recur-actions span { cursor: pointer; font-size: 16px; color: var(--text-muted); }

  .banner { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }

  .loading { text-align: center; padding: 60px 0; color: var(--text-muted); }
  .months-chart { display: flex; align-items: flex-end; gap: 8px; height: 150px; }
  .months-chart.tall { height: 190px; gap: 5px; }
  .month-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .month-bar-amt { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; white-space: nowrap; }
  .month-bar-track { width: 100%; max-width: 30px; flex: 1; display: flex; align-items: flex-end; }
  .month-bar-fill { width: 100%; background: var(--border); border-radius: 7px 7px 3px 3px; min-height: 3px; }
  .month-bar-fill.is-current { background: var(--accent); }
  .month-bar-label { font-size: 11px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }
  .month-bar-label.is-current { color: var(--text); }
  .export-option { display: block; width: 100%; text-align: right; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text); font-family: var(--font-body); }
  .export-option .sub { display: block; font-weight: 400; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
  <div class="loading" id="loading">טוען את ההוצאות שלך…</div>
</div>

<script>
(function() {
  "use strict";

  // ---------- Config ----------
  var DEFAULT_CATEGORIES = [
    "אוכל בחוץ / טייק אווי",
    "מכולת / סופר",
    "חשמל",
    "מים",
    "גז",
    "שכירות / משכנתא",
    "תחבורה",
    "טלפון / אינטרנט",
    "מנויים ובידור",
    "חינוך",
    "בריאות וביטוח",
    "טיפוח אישי",
    "קניות",
    "חיסכון והלוואות",
    "שונות"
  ];
  var MISC_CATEGORY = "שונות";
  var MONTH_SHORT_HE = ["ינו׳","פבר׳","מרץ","אפר׳","מאי","יונ׳","יול׳","אוג׳","ספט׳","אוק׳","נוב׳","דצמ׳"];

  var state = {
    db: null, useDb: false,
    sampler: null, canScan: false,
    scanMode: null, // "claude" (cloud vision, only inside claude.ai) | "tesseract" (offline, native Android build)
    downloader: null, canDownload: false,
    categories: [],
    budgets: {},
    expenses: [],
    recurring: [],
    month: monthKeyOf(new Date()),
    activeTab: "month",
    filterText: "",
    filterCategory: "",
    compareCategory: ""
  };

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function monthKeyOf(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1); }
  function monthLabel(key) {
    var parts = key.split("-");
    var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
    return d.toLocaleDateString("he-IL", { month: "long", year: "numeric" });
  }
  function daysInMonth(key) {
    var parts = key.split("-");
    return new Date(parseInt(parts[0], 10), parseInt(parts[1], 10), 0).getDate();
  }
  function shiftMonth(key, delta) {
    var parts = key.split("-");
    var y = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1;
    var d = new Date(y, m + delta, 1);
    return monthKeyOf(d);
  }
  function trailingMonthKeys(monthKey, count) {
    var out = [];
    for (var i = count - 1; i >= 0; i--) out.push(shiftMonth(monthKey, -i));
    return out;
  }
  function monthShortLabel(key) {
    var m = parseInt(key.split("-")[1], 10) - 1;
    return MONTH_SHORT_HE[m];
  }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  function fmtMoney(n) {
    var v = Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100;
    return v.toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₪";
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function isValidDateStr(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }

  // ---------- Storage layer (db capability with localStorage fallback) ----------
  var LS_KEYS = { categories: "exptrk_categories_he", budgets: "exptrk_budgets_he", expenses: "exptrk_expenses_he", recurring: "exptrk_recurring_he" };

  // Native (Android) builds store data in @capacitor/preferences, which lives
  // outside the WebView/Chrome storage entirely (installing or clearing the
  // app's Chrome data does not touch it). Plain browser/PWA use falls back to
  // localStorage.
  function nativePrefs() {
    try {
      if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
          && window.Capacitor.Plugins && window.Capacitor.Plugins.Preferences) {
        return window.Capacitor.Plugins.Preferences;
      }
    } catch (e) {}
    return null;
  }
  async function lsGet(key, fallback) {
    try {
      var prefs = nativePrefs();
      if (prefs) {
        var res = await prefs.get({ key: key });
        return (res && res.value != null) ? JSON.parse(res.value) : fallback;
      }
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  async function lsSet(key, val) {
    try {
      var prefs = nativePrefs();
      if (prefs) { await prefs.set({ key: key, value: JSON.stringify(val) }); return; }
      localStorage.setItem(key, JSON.stringify(val));
    } catch (e) {}
  }

  var Storage = {
    async init() {
      try {
        if (window.claude && window.claude.use) {
          var db = await window.claude.use("db");
          if (db) { state.db = db; state.useDb = true; }
          var sampler = await window.claude.use("sample");
          if (sampler) {
            try {
              var limits = await sampler.limits();
              if (limits && limits.images) { state.sampler = sampler; state.canScan = true; state.scanMode = "claude"; }
            } catch (e) {}
          }
          var downloader = await window.claude.use("downloads");
          if (downloader) { state.downloader = downloader; state.canDownload = true; }
        }
      } catch (e) {}

      // Native Android build: offline Hebrew OCR via the ReceiptScanner plugin
      // (Tesseract) plus the Camera plugin to take the photo. See
      // android-ocr-plugin/README.md for how this plugin is wired up.
      try {
        if (!state.canScan && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
            && window.Capacitor.Plugins && window.Capacitor.Plugins.ReceiptScanner && window.Capacitor.Plugins.Camera) {
          state.canScan = true;
          state.scanMode = "tesseract";
        }
      } catch (e) {}
    },
    async loadCategories() {
      if (state.useDb) {
        try {
          var snap = await state.db.doc("settings/categories").get();
          if (snap && snap.exists && snap.data && snap.data().list) return snap.data().list;
          await state.db.doc("settings/categories").set({ list: DEFAULT_CATEGORIES });
          return DEFAULT_CATEGORIES.slice();
        } catch (e) {}
      }
      var local = await lsGet(LS_KEYS.categories, null);
      if (!local) { local = DEFAULT_CATEGORIES.slice(); await lsSet(LS_KEYS.categories, local); }
      return local;
    },
    async saveCategories(list) {
      if (state.useDb) { try { await state.db.doc("settings/categories").set({ list: list }); return; } catch (e) {} }
      await lsSet(LS_KEYS.categories, list);
    },
    async loadBudgets() {
      if (state.useDb) {
        try {
          var snap = await state.db.doc("settings/budgets").get();
          if (snap && snap.exists && snap.data) return snap.data().map || {};
          return {};
        } catch (e) {}
      }
      return await lsGet(LS_KEYS.budgets, {});
    },
    async saveBudgets(map) {
      if (state.useDb) { try { await state.db.doc("settings/budgets").set({ map: map }); return; } catch (e) {} }
      await lsSet(LS_KEYS.budgets, map);
    },
    async loadExpenses() {
      if (state.useDb) {
        try {
          var snap = await state.db.collection("expenses").limit(1000).get();
          var out = [];
          snap.docs.forEach(function(d) { var data = d.data(); data.id = d.id; out.push(data); });
          return out;
        } catch (e) {}
      }
      return await lsGet(LS_KEYS.expenses, []);
    },
    async addExpense(data) {
      if (state.useDb) {
        try { var ref = await state.db.collection("expenses").add(data); data.id = ref.id; return data; } catch (e) {}
      }
      data.id = uid();
      var arr = await lsGet(LS_KEYS.expenses, []); arr.push(data); await lsSet(LS_KEYS.expenses, arr);
      return data;
    },
    async updateExpense(id, data) {
      if (state.useDb) { try { await state.db.collection("expenses").doc(id).update(data); return; } catch (e) {} }
      var arr = await lsGet(LS_KEYS.expenses, []);
      var idx = arr.findIndex(function(e) { return e.id === id; });
      if (idx >= 0) { Object.assign(arr[idx], data); await lsSet(LS_KEYS.expenses, arr); }
    },
    async deleteExpense(id) {
      if (state.useDb) { try { await state.db.collection("expenses").doc(id).delete(); return; } catch (e) {} }
      var arr = (await lsGet(LS_KEYS.expenses, [])).filter(function(e) { return e.id !== id; });
      await lsSet(LS_KEYS.expenses, arr);
    },
    async loadRecurring() {
      if (state.useDb) {
        try {
          var snap = await state.db.collection("recurring").limit(200).get();
          var out = [];
          snap.docs.forEach(function(d) { var data = d.data(); data.id = d.id; out.push(data); });
          return out;
        } catch (e) {}
      }
      return await lsGet(LS_KEYS.recurring, []);
    },
    async addRecurring(data) {
      if (state.useDb) { try { var ref = await state.db.collection("recurring").add(data); data.id = ref.id; return data; } catch (e) {} }
      data.id = uid();
      var arr = await lsGet(LS_KEYS.recurring, []); arr.push(data); await lsSet(LS_KEYS.recurring, arr);
      return data;
    },
    async updateRecurring(id, data) {
      if (state.useDb) { try { await state.db.collection("recurring").doc(id).update(data); return; } catch (e) {} }
      var arr = await lsGet(LS_KEYS.recurring, []);
      var idx = arr.findIndex(function(r) { return r.id === id; });
      if (idx >= 0) { Object.assign(arr[idx], data); await lsSet(LS_KEYS.recurring, arr); }
    },
    async deleteRecurring(id) {
      if (state.useDb) { try { await state.db.collection("recurring").doc(id).delete(); return; } catch (e) {} }
      var arr = (await lsGet(LS_KEYS.recurring, [])).filter(function(r) { return r.id !== id; });
      await lsSet(LS_KEYS.recurring, arr);
    }
  };

  // ---------- Recurring auto-generation ----------
  async function ensureRecurringForMonth(monthKey) {
    var dim = daysInMonth(monthKey);
    for (var i = 0; i < state.recurring.length; i++) {
      var tmpl = state.recurring[i];
      if (tmpl.active === false) continue;
      var already = state.expenses.some(function(e) { return e.recurringId === tmpl.id && e.date.slice(0, 7) === monthKey; });
      if (already) continue;
      var day = Math.min(tmpl.day || 1, dim);
      var date = monthKey + "-" + pad2(day);
      var saved = await Storage.addExpense({ date: date, amount: tmpl.amount, category: tmpl.category, description: tmpl.name, recurringId: tmpl.id, autoGenerated: true });
      state.expenses.push(saved);
    }
  }

  // ---------- Rendering ----------
  var MATERIAL_PALETTE = ["#2F6F5E","#B4562A","#4A5FA8","#8C5FB0","#2E7DA6","#8A8578","#B0855E","#6B8F4E","#A45C7A","#5B7B99"];
  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  function categoryColor(cat) {
    var idx = state.categories.indexOf(cat);
    if (idx === -1) idx = hashStr(cat);
    return MATERIAL_PALETTE[idx % MATERIAL_PALETTE.length];
  }
  function monthExpenses() {
    return state.expenses.filter(function(e) { return e.date && e.date.slice(0, 7) === state.month; })
      .sort(function(a, b) { return b.date.localeCompare(a.date); });
  }
  function totalForMonth(monthKey) {
    return state.expenses.filter(function(e) { return e.date && e.date.slice(0, 7) === monthKey; })
      .reduce(function(s, e) { return s + Number(e.amount || 0); }, 0);
  }
  function categoryTotalForMonth(monthKey, cat) {
    return state.expenses.filter(function(e) { return e.date && e.date.slice(0, 7) === monthKey && e.category === cat; })
      .reduce(function(s, e) { return s + Number(e.amount || 0); }, 0);
  }
  function categoryTotals(expenses) {
    var map = {};
    expenses.forEach(function(e) { map[e.category] = (map[e.category] || 0) + Number(e.amount || 0); });
    return Object.keys(map).map(function(cat) { return { cat: cat, total: map[cat] }; }).sort(function(a, b) { return b.total - a.total; });
  }

  function pieChartHtml(totals, total) {
    if (!totals.length) return '<div class="empty-note">אין הוצאות החודש עדיין.</div>';
    var r = 60, cx = 80, cy = 80, sw = 30;
    var circumference = 2 * Math.PI * r;
    var acc = 0;
    var circles = totals.map(function(t) {
      var pct = total > 0 ? (t.total / total) : 0;
      var dash = pct * circumference;
      var seg = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + categoryColor(t.cat) + '" ' +
        'stroke-width="' + sw + '" stroke-dasharray="' + dash.toFixed(2) + ' ' + (circumference - dash).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-acc).toFixed(2) + '"></circle>';
      acc += dash;
      return seg;
    }).join("");
    var svg = '<svg viewBox="0 0 160 160" width="170" height="170" style="transform:rotate(-90deg)">' + circles + '</svg>';
    var legend = totals.map(function(t) {
      var pct = total > 0 ? Math.round((t.total / total) * 100) : 0;
      var html = '<div class="legend-item"><div class="legend-row"><span class="legend-dot" style="background:' + categoryColor(t.cat) + '"></span>' +
        '<span class="legend-name">' + escapeHtml(t.cat) + '</span>' +
        '<span class="legend-pct">' + pct + '%</span>' +
        '<span class="legend-amt">' + fmtMoney(t.total) + '</span></div>';
      var budget = state.budgets[t.cat];
      if (budget && budget > 0) {
        var bpct = Math.min(100, Math.round((t.total / budget) * 100));
        var over = t.total > budget;
        html += '<div class="budget-bar"><div class="budget-bar-fill' + (over ? ' over' : '') + '" style="width:' + bpct + '%"></div></div>' +
          '<div class="budget-label' + (over ? ' over' : '') + '">' + fmtMoney(t.total) + ' מתוך תקציב ' + fmtMoney(budget) + (over ? ' — חריגה מהתקציב' : '') + '</div>';
      }
      html += '</div>';
      return html;
    }).join("");
    return '<div class="pie-wrap">' + svg + '<div class="pie-center"><div class="pie-total">' + fmtMoney(total) + '</div><div class="pie-total-lbl">סה"כ</div></div></div>' +
      '<div class="legend-list">' + legend + '</div>';

  function monthsChartHtml(trailTotals, tall) {
    var trailMax = Math.max.apply(null, trailTotals.map(function(t) { return t.total; }).concat([0.01]));
    var html = '<div class="months-chart' + (tall ? ' tall' : '') + '">';
    trailTotals.forEach(function(t) {
      var pct = t.total > 0 ? Math.max(4, Math.round((t.total / trailMax) * 100)) : 2;
      var isCur = t.key === state.month;
      html += '<div class="month-bar-col" data-month="' + t.key + '">' +

        '<div class="month-bar-label' + (isCur ? ' is-current' : '') + '">' + monthShortLabel(t.key) + '</div>' +

  // ---- Best-effort parsing of raw Tesseract OCR text (offline/native path) ----
  // Tesseract only returns plain text (no structured fields like the cloud
  // path does), so we heuristically pull an amount and a description out of
  // it. Digits parse the same regardless of script, so the amount is fairly
  // reliable; the description is a best guess and the person should check it.
  function extractAmountFromText(text) {
    if (!text) return null;
    var lines = text.split(/\n/);
    var totalKeywords = /(סה"?כ|לתשלום|סכום|total|amount)/i;
    var candidates = [];
    lines.forEach(function(line) {
      var nums = line.match(/\d{1,3}(?:[,.]\d{3})*(?:[.,]\d{1,2})?/g);
      if (!nums) return;
      nums.forEach(function(n) {
        var val = parseFloat(n.replace(/,/g, ""));
        if (!isNaN(val) && val > 0 && val < 100000) {
          candidates.push({ val: val, nearTotal: totalKeywords.test(line) });
        }
      });
    });
    if (!candidates.length) return null;
    var totalLine = candidates.filter(function(c) { return c.nearTotal; });
    var pool = totalLine.length ? totalLine : candidates;
    return pool.reduce(function(max, c) { return c.val > max.val ? c : max; }).val;
  }
  function guessDescriptionFromText(text) {
    if (!text) return "";
    var lines = text.split(/\n/).map(function(l) { return l.trim(); }).filter(Boolean);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.length < 2) continue;
      if (/^\d+([.,]\d+)?$/.test(line)) continue; // a bare number, skip
      return line.slice(0, 60);
    }
    return "";
  }

  async function scanWithTesseract(scanBtn, originalLabel) {
    var Camera = window.Capacitor.Plugins.Camera;
    var ReceiptScanner = window.Capacitor.Plugins.ReceiptScanner;
    scanBtn.disabled = true;
    scanBtn.textContent = "📷 מצלמים את הקבלה…";
    try {
      var photo = await Camera.getPhoto({ resultType: "uri", source: "CAMERA", quality: 80, width: 2000, correctOrientation: true });
      var path = photo && (photo.path || photo.webPath);
      if (!path) return;
      scanBtn.textContent = "🔎 סורק את הקבלה (זיהוי אופליין)…";
      var res = await ReceiptScanner.scanImage({ path: path });
      var text = (res && res.text) || "";
      var amt = extractAmountFromText(text);
      if (amt) document.getElementById("f-amount").value = amt;
      var desc = guessDescriptionFromText(text);
      if (desc) document.getElementById("f-desc").value = desc;
      if (!amt && !desc) {
        alert("לא הצלחתי לזהות טקסט ברור בקבלה. אפשר למלא ידנית.");
      } else {
        alert("זוהה טקסט מהקבלה — כדאי לבדוק שהסכום והתיאור נכונים לפני השמירה.");
      }
    } catch (e) {
      if (e && e.message !== "User cancelled photos app") {
        alert("הצילום/הסריקה נכשלו. אפשר למלא ידנית.");
      }
    } finally {
      scanBtn.disabled = false;
      scanBtn.textContent = originalLabel;
    }
  }

    var isRecurringInstance = existing && existing.recurringId;

    var html = '<div class="sheet-header"><h3>' + (existing ? "עריכת הוצאה" : "הוספת הוצאה") + '</h3><span class="close" id="sheet-close">✕</span></div>';

    if (!existing) {
      html += '<input type="file" id="f-scan-input" accept="image/*" capture="environment" style="display:none">' +
        '<button type="button" class="btn btn-secondary" id="f-scan-btn">📷 סריקת קבלה (מילוי אוטומטי)</button>' +
        '<div class="divider-text">— או הזינו ידנית —</div>';
    }

    html += '<label>תיאור</label>' +
      '<input type="text" id="f-desc" placeholder="לדוגמה: ארוחת ערב" value="' + escapeHtml(existing ? existing.description : "") + '">' +
      '<label>סכום (₪)</label>' +
      '<input type="number" id="f-amount" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="' + (existing ? existing.amount : "") + '">' +
      '<label>קטגוריה</label>' +
      '<select id="f-category">' + categoryOptions(existing ? existing.category : state.categories[0]) + '</select>' +
      '<label>תאריך</label>' +
      '<input type="date" id="f-date" value="' + defaultDate + '">';

    if (!existing) {
      html += '<div class="checkbox-row"><input type="checkbox" id="f-recurring"><label for="f-recurring">חוזרת כל חודש (למשל מנוי, חשבון טלפון)</label></div>' +
        '<div id="f-day-wrap" style="display:none;"><label>באיזה יום בחודש היא מחויבת</label>' +
        '<input type="number" id="f-day" min="1" max="28" value="1"></div>';
    } else if (isRecurringInstance) {
      html += '<div class="banner" style="margin-top:14px;">הוצאה זו נוצרה אוטומטית מהוצאה קבועה. עריכה תשנה רק את הרשומה של החודש הזה.</div>';
    }

    html += '<button class="btn btn-primary" id="f-save">שמירה</button>';
    if (existing) html += '<button class="btn btn-danger" id="f-delete">מחיקת ההוצאה</button>';

    var overlay = openSheet(html);
    document.getElementById("sheet-close").onclick = function() { closeSheet(overlay); };

    var recurringChk = document.getElementById("f-recurring");
    if (recurringChk) {
      recurringChk.onchange = function() {
        document.getElementById("f-day-wrap").style.display = recurringChk.checked ? "block" : "none";
        if (recurringChk.checked) {
          var dateVal = document.getElementById("f-date").value;
          if (dateVal) document.getElementById("f-day").value = parseInt(dateVal.slice(8, 10), 10);
        }
      };
    }

    var scanBtn = document.getElementById("f-scan-btn");
    if (scanBtn) {
      var scanInput = document.getElementById("f-scan-input");
      scanBtn.onclick = function() {
        if (!state.canScan) { alert("סריקת קבלות לא זמינה כרגע בתצוגה הזו."); return; }
        if (state.scanMode === "tesseract") {
          scanWithTesseract(scanBtn, scanBtn.textContent);
          return;
        }
        scanInput.click();
      };
      scanInput.onchange = async function() {
        var file = scanInput.files && scanInput.files[0];
        if (!file) return;
        scanBtn.disabled = true;
        var originalLabel = scanBtn.textContent;
        scanBtn.textContent = "🔎 סורק את הקבלה…";
        try {
          var catList = state.categories.join(", ");
          var prompt = "זוהי תמונה של קבלה או חשבונית. חלץ ממנה פרטים והחזר אך ורק אובייקט JSON תקין, בלי טקסט נוסף, בפורמט הבא:\n" +
            '{"amount": מספר (הסכום הכולל ששולם, ללא סימן מטבע), ' +
            '"description": מחרוזת קצרה בעברית (שם העסק או תיאור הקנייה), ' +
            '"category": אחת מהקטגוריות הבאות בדיוק כפי שהן כתובות (' + catList + '), ' +
            '"date": תאריך בפורמט YYYY-MM-DD אם מופיע בקבלה, אחרת null}';
          var result = await state.sampler.json(prompt, { images: file, modelTier: "default", cache: false });
          if (result && typeof result === "object") {
            if (result.description) document.getElementById("f-desc").value = String(result.description).slice(0, 120);
            var amt = parseFloat(result.amount);
            if (!isNaN(amt) && amt > 0) document.getElementById("f-amount").value = amt;
            if (result.category && state.categories.indexOf(result.category) !== -1) {
              document.getElementById("f-category").value = result.category;
            } else {
              document.getElementById("f-category").value = state.categories.indexOf(MISC_CATEGORY) !== -1 ? MISC_CATEGORY : state.categories[0];
            }
            if (isValidDateStr(result.date)) document.getElementById("f-date").value = result.date;
          }
        } catch (e) {
          var msg = scanErrorMessage(e && e.code);
          if (msg) alert(msg);
        } finally {
          scanBtn.disabled = false;
          scanBtn.textContent = originalLabel;
          scanInput.value = "";
        }
      };
    }

    document.getElementById("f-save").onclick = async function() {
      var desc = document.getElementById("f-desc").value.trim();
      var amount = parseFloat(document.getElementById("f-amount").value);
      var category = document.getElementById("f-category").value;
      var date = document.getElementById("f-date").value;

      if (!amount || amount <= 0 || isNaN(amount)) { alert("נא להזין סכום תקין."); return; }
      if (!date) { alert("נא לבחור תאריך."); return; }

      if (existing) {
        var updates = { description: desc, amount: amount, category: category, date: date };
        await Storage.updateExpense(existing.id, updates);
        Object.assign(existing, updates);
      } else {
        var makeRecurring = recurringChk && recurringChk.checked;
        if (makeRecurring) {
          var day = parseInt(document.getElementById("f-day").value, 10) || parseInt(date.slice(8, 10), 10);
          var tmpl = await Storage.addRecurring({ name: desc || category, amount: amount, category: category, day: day, active: true });
          state.recurring.push(tmpl);
          var exp = await Storage.addExpense({ date: date, amount: amount, category: category, description: desc || category, recurringId: tmpl.id });
          state.expenses.push(exp);
        } else {
          var exp2 = await Storage.addExpense({ date: date, amount: amount, category: category, description: desc });
          state.expenses.push(exp2);
        }
      }
      closeSheet(overlay);
      render();
    };

    var delBtn = document.getElementById("f-delete");
    if (delBtn) {
      delBtn.onclick = async function() {
        if (!confirm("למחוק את ההוצאה?")) return;
        await Storage.deleteExpense(existing.id);
        state.expenses = state.expenses.filter(function(e) { return e.id !== existing.id; });
        closeSheet(overlay);
        render();
      };
    }
  }

  function openEditRecurringSheet(id, onSaved) {
    var r = state.recurring.find(function(x) { return x.id === id; });
    if (!r) return;
    var html = '<div class="sheet-header"><h3>עריכת הוצאה קבועה</h3><span class="close" id="edit-close">✕</span></div>' +
      '<label>שם</label>' +
      '<input type="text" id="er-name" value="' + escapeHtml(r.name) + '">' +
      '<label>סכום (₪)</label>' +
      '<input type="number" id="er-amount" inputmode="decimal" step="0.01" min="0" value="' + r.amount + '">' +
      '<label>קטגוריה</label>' +
      '<select id="er-category">' + categoryOptions(r.category) + '</select>' +
      '<label>באיזה יום בחודש היא מחויבת</label>' +
      '<input type="number" id="er-day" min="1" max="28" value="' + r.day + '">' +
      '<div class="banner" style="margin-top:14px;">השינוי ישפיע רק על חודשים הבאים. הוצאות שכבר נוצרו לא ישתנו.</div>' +
      '<button class="btn btn-primary" id="er-save">שמירה</button>';
    var editOverlay = openSheet(html);
    document.getElementById("edit-close").onclick = function() { closeSheet(editOverlay); };
    document.getElementById("er-save").onclick = async function() {
      var name = document.getElementById("er-name").value.trim();
      var amount = parseFloat(document.getElementById("er-amount").value);
      var category = document.getElementById("er-category").value;
      var day = parseInt(document.getElementById("er-day").value, 10);
      if (!amount || amount <= 0 || isNaN(amount)) { alert("נא להזין סכום תקין."); return; }
      if (!day || day < 1 || day > 28) { alert("נא להזין יום תקין בין 1 ל-28."); return; }
      var updates = { name: name || category, amount: amount, category: category, day: day };
      await Storage.updateRecurring(id, updates);
      Object.assign(r, updates);
      closeSheet(editOverlay);
      if (onSaved) onSaved();
    };
  }

  function openRecurringSheet() {
    function body() {
      var html = '<div class="sheet-header"><h3>הוצאות קבועות</h3><span class="close" id="sheet-close">✕</span></div>';
      if (!state.recurring.length) {
        html += '<div class="empty-note">אין עדיין הוצאות קבועות. הוסיפו הוצאה וסמנו "חוזרת כל חודש".</div>';
      } else {
        state.recurring.forEach(function(r) {
          html += '<div class="recur-item"><div class="recur-info"><div class="name">' + escapeHtml(r.name) +
            (r.active === false ? ' <span class="recur-badge">מושהית</span>' : '') + '</div>' +
            '<div class="meta">' + escapeHtml(r.category) + ' · ' + fmtMoney(r.amount) + ' ביום ' + r.day + '</div></div>' +
            '<div class="recur-actions"><span data-act="edit" data-id="' + r.id + '">✏️</span>' +
            '<span data-act="toggle" data-id="' + r.id + '">' + (r.active === false ? "▶️" : "⏸") + '</span>' +
            '<span data-act="delete" data-id="' + r.id + '">🗑️</span></div></div>';
        });
      }
      return html;
    }
    var overlay = openSheet(body());
    function wire() {
      document.getElementById("sheet-close").onclick = function() { closeSheet(overlay); };
      overlay.querySelectorAll('[data-act="edit"]').forEach(function(el) {
        el.onclick = function() {
          openEditRecurringSheet(el.getAttribute("data-id"), function() {
            overlay.querySelector(".sheet").innerHTML = body(); wire(); render();
          });
        };
      });
      overlay.querySelectorAll('[data-act="toggle"]').forEach(function(el) {
        el.onclick = async function() {
          var id = el.getAttribute("data-id");
          var r = state.recurring.find(function(x) { return x.id === id; });
          var newActive = r.active === false ? true : false;
          await Storage.updateRecurring(id, { active: newActive });
          r.active = newActive;
          overlay.querySelector(".sheet").innerHTML = body(); wire(); render();
        };
      });
      overlay.querySelectorAll('[data-act="delete"]').forEach(function(el) {
        el.onclick = async function() {
          if (!confirm('להפסיק את ההוצאה הקבועה הזו? רשומות עבר יישארו, אבל היא לא תתווסף אוטומטית בחודשים הבאים.')) return;
          var id = el.getAttribute("data-id");
          await Storage.deleteRecurring(id);
          state.recurring = state.recurring.filter(function(x) { return x.id !== id; });
          overlay.querySelector(".sheet").innerHTML = body(); wire(); render();
        };
      });
    }
    wire();
  }

  async function renameCategory(oldName, newName) {
    if (!newName || newName === oldName) return;
    if (state.categories.indexOf(newName) !== -1) { alert("כבר קיימת קטגוריה בשם הזה."); return; }

    state.categories = state.categories.map(function(c) { return c === oldName ? newName : c; });
    await Storage.saveCategories(state.categories);

    if (Object.prototype.hasOwnProperty.call(state.budgets, oldName)) {
      state.budgets[newName] = state.budgets[oldName];
      delete state.budgets[oldName];
      await Storage.saveBudgets(state.budgets);
    }

    var expenseUpdates = state.expenses.filter(function(e) { return e.category === oldName; });
    for (var i = 0; i < expenseUpdates.length; i++) {
      expenseUpdates[i].category = newName;
      await Storage.updateExpense(expenseUpdates[i].id, { category: newName });
    }

    var recurringUpdates = state.recurring.filter(function(r) { return r.category === oldName; });
    for (var j = 0; j < recurringUpdates.length; j++) {
      recurringUpdates[j].category = newName;
      await Storage.updateRecurring(recurringUpdates[j].id, { category: newName });
    }

    if (state.filterCategory === oldName) state.filterCategory = newName;
    if (state.compareCategory === oldName) state.compareCategory = newName;
  }

  function openSettingsSheet() {
    function body() {
      var rows = state.categories.map(function(c) {
        var budget = state.budgets[c] || "";
        return '<div class="cat-row" data-cat="' + escapeHtml(c) + '">' +
          '<input type="text" class="cat-row-name-input" data-cat="' + escapeHtml(c) + '" value="' + escapeHtml(c) + '">' +
          '<input type="number" class="cat-row-budget" min="0" step="1" placeholder="ללא תקציב" value="' + budget + '">' +
          '<span class="x" data-cat="' + escapeHtml(c) + '">✕</span></div>';
      }).join("");
      return '<div class="sheet-header"><h3>קטגוריות ותקציבים</h3><span class="close" id="sheet-close">✕</span></div>' +
        '<div class="cat-list">' + rows + '</div>' +
        '<label>הוספת קטגוריה</label>' +
        '<input type="text" id="new-cat" placeholder="לדוגמה: נסיעות לחו״ל">' +
        '<button class="btn btn-secondary" id="add-cat">הוספה</button>';
    }
    var overlay = openSheet(body());
    function wire() {
      document.getElementById("sheet-close").onclick = function() { closeSheet(overlay); };
      overlay.querySelectorAll(".cat-row-name-input").forEach(function(el) {
        el.onchange = async function() {
          var oldName = el.getAttribute("data-cat");
          var newName = el.value.trim();
          if (!newName) { el.value = oldName; return; }
          await renameCategory(oldName, newName);
          overlay.querySelector(".sheet").innerHTML = body(); wire(); render();
        };
      });
      overlay.querySelectorAll(".cat-row-budget").forEach(function(el) {
        el.onchange = async function() {
          var cat = el.closest(".cat-row").getAttribute("data-cat");
          var val = parseFloat(el.value);
          if (!val || val <= 0 || isNaN(val)) { delete state.budgets[cat]; } else { state.budgets[cat] = val; }
          await Storage.saveBudgets(state.budgets);
        };
      });
      overlay.querySelectorAll(".x").forEach(function(el) {
        el.onclick = async function() {
          var cat = el.getAttribute("data-cat");
          if (state.categories.length <= 1) { alert("חייבת להישאר לפחות קטגוריה אחת."); return; }
          state.categories = state.categories.filter(function(c) { return c !== cat; });
          delete state.budgets[cat];
          await Storage.saveCategories(state.categories);
          await Storage.saveBudgets(state.budgets);
          overlay.querySelector(".sheet").innerHTML = body(); wire(); render();
        };
      });
      document.getElementById("add-cat").onclick = async function() {
        var input = document.getElementById("new-cat");
        var val = input.value.trim();
        if (!val) return;
        if (state.categories.indexOf(val) !== -1) { input.value = ""; return; }
        state.categories.push(val);
        await Storage.saveCategories(state.categories);
        overlay.querySelector(".sheet").innerHTML = body(); wire();
      };
    }
    wire();
  }

  // ---------- CSV export ----------
  function csvEscape(val) {
    var s = String(val == null ? "" : val);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function buildCsv(expenses) {
    var rows = [["תאריך", "קטגוריה", "תיאור", "סכום", "הוצאה קבועה"]];
    expenses.slice().sort(function(a, b) { return a.date.localeCompare(b.date); }).forEach(function(e) {
      rows.push([e.date, e.category, e.description || "", Number(e.amount || 0).toFixed(2), e.recurringId ? "כן" : "לא"]);
    });
    var csv = rows.map(function(r) { return r.map(csvEscape).join(","); }).join("\r\n");
    return "\uFEFF" + csv; // BOM so Hebrew displays correctly in Excel
  }
  async function exportCsv(scope) {
    var expenses = scope === "month" ? monthExpenses() : state.expenses;
    if (!expenses.length) { alert("אין נתונים לייצוא."); return; }
    var csv = buildCsv(expenses);
    var filename = scope === "month" ? ("הוצאות-" + state.month + ".csv") : "כל-ההוצאות.csv";
    if (state.canDownload) {
      try {
        await state.downloader.save({ filename: filename, data: csv });
        return;
      } catch (e) {
        if (e && e.code === "declined") return;
        // fall through to browser fallback
      }
    }
    try {
      var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
    } catch (e) {
      alert("הייצוא לא זמין בתצוגה הזו.");
    }
  }
  function openExportSheet() {
    var html = '<div class="sheet-header"><h3>ייצוא ל-CSV</h3><span class="close" id="sheet-close">✕</span></div>' +
      '<button type="button" class="export-option" id="exp-month">ייצוא החודש הנוכחי<span class="sub">' + escapeHtml(monthLabel(state.month)) + '</span></button>' +
      '<button type="button" class="export-option" id="exp-all">ייצוא כל הנתונים<span class="sub">כל ההוצאות שנשמרו</span></button>';
    var overlay = openSheet(html);
    document.getElementById("sheet-close").onclick = function() { closeSheet(overlay); };
    document.getElementById("exp-month").onclick = function() { exportCsv("month"); closeSheet(overlay); };
    document.getElementById("exp-all").onclick = function() { exportCsv("all"); closeSheet(overlay); };
  }

  // ---------- Boot ----------
  async function boot() {
    await Storage.init();
    state.categories = await Storage.loadCategories();
    state.budgets = await Storage.loadBudgets();
    state.expenses = await Storage.loadExpenses();
    state.recurring = await Storage.loadRecurring();
    await ensureRecurringForMonth(state.month);
    render();
  }

  boot();
})();
</script>
